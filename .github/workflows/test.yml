name: build and test

on:
  push:
  pull_request:
    branches: [ master ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**/packages.lock.json'
      - '.github/workflows/test.yml'
  workflow_call:
    inputs:
      require-current-artifact:
        description: Require the server artifact from the current workflow run
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v3
        with: 
          repository: ZNotify/cs-sdk

      - uses: ZNotify/test-server-action@master
        with:
          require-current-artifact: ${{ inputs.require-current-artifact || false }}
        
      - uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
        
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal --collect:"XPlat Code Coverage"

